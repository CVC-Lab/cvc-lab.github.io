site_name: dbg-radios (radio-sim docs)
site_description: Tactical radio emulator documentation (CSMA, TDMA/TSM, local control overlay)
site_author: DBG Radios

docs_dir: radio-sim/docs

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home:
      - Overview: README.md
  - Getting Started:
      - Quickstart: getting_started.md
      - Documentation Workflow: documentation_workflow.md
  - Architecture:
      - System Overview: architecture_overview.md
      - API Interface: API_interface.md
      - PIN Controller API: pin_controller_api.md
      - PIN MARL Formulation: pin_marl_formulation.md
      - PIN Learning Algorithm: pin_learning_algorithm.md
      - Technical Specification: technical_specification.md
  - Protocol Stack:
      - Protocol Overview: protocols.md
      - CSMA/CA MAC Deep Dive: mac_csma_implementation.md
      - TDMA/TSM MAC Deep Dive: mac_tdma_implementation.md
  - Environment:
      - Channel & Propagation: environment_propagation.md
  - Performance:
      - Performance Optimizations: performance_optimizations.md
  - Validation:
      - Conformance Harness: conformance/README.md
      - PIN Optimal-Control Experiment: pin_optimal_control_experiment.md
  - Maintenance:
      - Known Issues: known_issues.md

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid-init.js
