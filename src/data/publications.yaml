# Publications listed on /publications/. This file is the only source of that list:
# edit it (on GitHub or locally) and the next build publishes the change. The build checks
# every entry and stops with the entry number, line and title when one is wrong.
# Step-by-step guide: docs/ADDPUBLICATION.md.
#
# One entry per paper. Leave out keys you do not use.
#   title          Required. Paper title.
#   authors        Required. Author list, as it should appear.
#   venue          Journal, conference, publisher or other venue. May contain simple HTML:
#                  <a href="https://...">, <i>, <em>, <b>, <strong>, <br>.
#   type           Required. One of the headings listed below.
#   year           Required. Four-digit year, without quotes.
#   month          1 to 12. Not shown on the page.
#   pdf            Link to the paper: a full URL (https://...), or a site path such as
#                  /papers/name.pdf for a file in static/papers/.
#   project        Project page: a site path such as /projects/phast/, or a full URL.
#   doi            DOI, such as 10.1145/3337680. Not shown on the page.
#   arxiv          arXiv identifier, such as 2402.14081. Not shown on the page.
#   thumbnail      Image shown next to the entry: put the PNG or JPG in
#                  src/images/publications/ and write its path without the extension and
#                  with the file name's capitals, such as publications/PUB_QC-PHAST_Search.
#   thumbnail_alt  Required with thumbnail. Short description of the image.
#   id             PaperID from the retired Google Sheet. Leave it out for new entries.
#
# type is one of these, and the page shows them in this order within each year:
#   Journal Publications, arXiv, Conference Presentations & Publications, Technical Reports,
#   Book, Edited Books, Book Chapters, Multimedia
#
# Order: entries are grouped by year, newest year first (a "# year" line starts each group).
# Within a year and type the page lists entries in the order of this file.
#
# Put a value in quotes when it starts with a quote, [, {, #, &, *, !, |, >, %, @ or `,
# or when it contains ": " or " #" (as many titles below do).

